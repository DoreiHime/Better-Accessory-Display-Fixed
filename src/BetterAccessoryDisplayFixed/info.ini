name = BetterAccessoryDisplayFixed
displayName = 更好的配件展示 · 修复版 | Better Accessory Display (Fixed)
description = 原版「更好的配件展示」的独立修复版：保留 6 个配件槽的视觉效果（已装槽白点、武器没有的槽灰点、未搜索武器不显示），去掉了每次刷新约 48 行 Debug 日志和每次 Refresh 的重复清空/重建，改为静态缓存反射成员 + 按需重建。需要原版 BetterAccessoryDisplay(3596581923) 与 HarmonyLoadMod(3589088839)，原版必须保持启用；本 mod 不包含原版文件，原版下载量归原作者。\nAn independent fixed version of "Better Accessory Display": same 6-slot visuals, but without the ~48 Debug lines per refresh and without rebuilding all indicators on every Refresh (cached reflection members + on-demand rebuild). Requires the original BetterAccessoryDisplay (3596581923) and HarmonyLoadMod (3589088839); the original must stay enabled. Does not bundle the original mod.
